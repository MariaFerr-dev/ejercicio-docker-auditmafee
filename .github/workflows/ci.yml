name: CI - Pruebas y Seguridad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: pytest -q

  bandit:
    name: Bandit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar Bandit
        run: pip install bandit==1.8.6

      - name: Analizar código
        run: bandit -r app.py -f txt -o auditoria_bandit.txt

      - name: Publicar informe Bandit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-bandit
          path: auditoria_bandit.txt

  trivy:
    name: Trivy - imagen Docker
    runs-on: ubuntu-latest
    needs: [test, bandit]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Construir imagen
        run: docker build -t technova-api:${{ github.sha }} .

      - name: Escanear imagen
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.56.1 image
          --format table
          --exit-code 1
          --ignore-unfixed
          --severity CRITICAL,HIGH
          technova-api:${{ github.sha }}

  deploy:
    name: Desplegar en EC2
    runs-on: ubuntu-latest
    needs: [test, bandit, trivy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          port: 22
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            app_path=/home/ubuntu/ejercicio-docker-audit
            if [ ! -d "$app_path/.git" ]; then
              env_file=/tmp/ejercicio-docker-audit.env
              if [ -f "$app_path/.env" ]; then cp "$app_path/.env" "$env_file"; fi
              rm -rf "$app_path"
              git clone https://github.com/MariaFerr-dev/ejercicio-docker-auditmafee.git "$app_path"
              if [ -f "$env_file" ]; then mv "$env_file" "$app_path/.env"; fi
            fi
            cd "$app_path"
            git pull --ff-only origin main
            docker compose pull
            docker compose up -d --build
            docker compose ps
