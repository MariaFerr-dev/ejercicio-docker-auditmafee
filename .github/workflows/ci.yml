name: CI - Pruebas y Seguridad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: pytest -q

  bandit:
    name: Bandit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar Bandit
        run: pip install bandit==1.8.6

      - name: Analizar código
        run: bandit -r app.py -f txt -o auditoria_bandit.txt

      - name: Publicar informe Bandit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-bandit
          path: auditoria_bandit.txt

  build-push:
    name: Build y push de imagen
    runs-on: ubuntu-latest
    needs: [test, bandit]
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.IMAGE }}
    env:
      IMAGE: ghcr.io/mariaferr-dev/technova-api:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/mariaferr-dev/technova-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy:
    name: Trivy - imagen Docker
    runs-on: ubuntu-latest
    needs: [build-push]
    steps:
      - name: Pull imagen
        run: docker pull ghcr.io/mariaferr-dev/technova-api:latest

      - name: Escanear imagen
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.56.1 image
          --format table
          --exit-code 1
          --ignore-unfixed
          --severity CRITICAL,HIGH
          ghcr.io/mariaferr-dev/technova-api:latest

  deploy:
    name: Desplegar en EC2
    runs-on: ubuntu-latest
    needs: [build-push, trivy]
    environment: HOST
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          port: 22
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 15m
          script: |
            set -e
            app_path=/home/ubuntu/ejercicio-docker-audit

            if [ ! -d "$app_path/.git" ]; then
              env_file=/tmp/ejercicio-docker-audit.env
              if [ -f "$app_path/.env" ]; then cp "$app_path/.env" "$env_file"; fi
              rm -rf "$app_path"
              git clone https://github.com/MariaFerr-dev/ejercicio-docker-auditmafee.git "$app_path"
              if [ -f "$env_file" ]; then mv "$env_file" "$app_path/.env"; fi
            fi

            cd "$app_path"
            git pull --ff-only origin main

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull ghcr.io/mariaferr-dev/technova-api:latest

            docker compose up -d db dozzle uptime-kuma
            docker compose up -d api

            for attempt in 1 2 3 4 5 6; do
              if curl -fsS http://127.0.0.1:5050/health; then
                echo
                break
              fi
              if [ "$attempt" -eq 6 ]; then
                echo "La API no respondió en /health" >&2
                docker compose logs --tail=100 api >&2 || true
                exit 1
              fi
              sleep 5
            done
            docker compose ps
            docker logout ghcr.io || true